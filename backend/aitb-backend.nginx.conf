# AI Transit Hub Backend Nginx 配置文件
# 适用于反向代理 Go 后端服务
# 部署路径: /etc/nginx/sites-available/aitb-backend

upstream aitb_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;  # 替换为你的域名

    # 日志
    access_log /var/log/nginx/aitb-backend.access.log;
    error_log /var/log/nginx/aitb-backend.error.log;

    # 客户端上传大小限制（根据需要调整）
    client_max_body_size 100M;

    # 主后端接口
    location / {
        proxy_pass http://aitb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # 缓存设置
        proxy_buffering off;
    }

    # 健康检查接口
    location /health {
        proxy_pass http://aitb_backend;
        access_log off;
    }

    # 静态文件（如果有）
    location /static/ {
        alias /data/sites/aitb/backend/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}


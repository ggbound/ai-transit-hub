# AI Transit Hub 前端 Nginx 配置文件
# 部署路径: /etc/nginx/sites-available/aitb-frontend

server {
    listen 80;
    server_name your-domain.com;  # 替换为你的前端域名

    # 日志
    access_log /var/log/nginx/aitb-frontend.access.log;
    error_log /var/log/nginx/aitb-frontend.error.log;

    # 网站根目录
    root /data/sites/aitb/frontend/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # 主站点配置
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

